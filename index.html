<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Ruben Lorenz Y. | Blog preview card</title>

</head>
<body>

  <div class="card-main">
    <img class="card-img" src="./assets/images/illustration-article.svg" alt="Illustration Image of the article" />
    <div class="card-content">
      <div class="card-cat">Learning</div>
      <p class="card-date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
      <h1 class="card-title">HTML & CSS foundations</h1>
      <p class="card-desc">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="card-author">
      <img src="./assets/images/image-avatar.webp" class="author-img" alt="Photo of  Greg Hooper" />
      <h2 class="author-name">Greg Hooper</h2>
    </div>
  </div>

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/rulo-codes">Ruben Lorenz Y</a>.
  </footer>
</body>
</html>
